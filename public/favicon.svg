<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081610" />
      <stop offset="100%" stop-color="#030C07" />
    </linearGradient>
    <linearGradient id="logoBorder" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="4" filter="url(#glow)" />

  <!-- Outer Speed Ring Accent -->
  <path d="M 22 50 A 28 28 0 0 1 78 50" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />

  <!-- Play Triangle with Sharp Geometric Cut -->
  <path d="M 40 32 L 72 50 L 40 68 Z" fill="url(#playGrad)" filter="url(#glow)" />
  
  <!-- Dynamic Growth Pulse Bar -->
  <rect x="32" y="73" width="6" height="8" rx="2" fill="#10B981" />
  <rect x="42" y="69" width="6" height="12" rx="2" fill="#34D399" />
  <rect x="52" y="65" width="6" height="16" rx="2" fill="#14B8A6" />
  <rect x="62" y="61" width="6" height="20" rx="2" fill="#06B6D4" />
</svg>
